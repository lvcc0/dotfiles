### VARIABLES ###

# programs
$terminal = kitty
$file_mgr = dolphin
$menu = wofi --show drun
$ide = zeditor
$browser = firefox
$browser_private = firefox --private-window

# directories
$scripts_dir = ~/.config/scripts
$screenshots_dir = ~/Screenshots

### MONITORS ###
source = ~/.config/hypr/conf/monitors.conf

### AUTOSTART ###
source = ~/.config/hypr/conf/autostart.conf

### ENVIRONMENT VARIABLES ###
source = ~/.config/hypr/conf/environment.conf

### DESIGN ###
source = ~/.config/hypr/conf/design.conf

### INPUT ###
source = ~/.config/hypr/conf/input.conf

### BINDS ###
source = ~/.config/hypr/conf/binds.conf

### WINDOW RULES ###
source = ~/.config/hypr/conf/windowrules.conf
