# --- #
# Design-related stuff
# note: will split this file further
# --- #

general {
    gaps_in = 4
    gaps_out = 8

    border_size = 1

    col.active_border = rgb(efefef)
    col.inactive_border = rgb(888888)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 0
        render_power = 1
        color = rgba(000000FF)
        offset = 4, 4
        ignore_window = true
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
