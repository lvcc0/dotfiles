# --- #
# Binds
# https://wiki.hypr.land/Configuring/Binds/
# --- #

$mod = SUPER

# apps
bind = $mod,       T, exec, $terminal
bind = $mod,       E, exec, $file_mgr
bind = $mod,       R, exec, $menu
bind = $mod,       C, exec, $ide
bind = $mod,       B, exec, $browser
bind = $mod SHIFT, B, exec, $browser_private

# actions
bind = $mod CTRL,  L, exec, hyprlock

# windows
bind = $mod,       W, killactive,                                                       # kill active window
bind = $mod SHIFT, W, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # kill all instances of active window
bind = $mod,       F, fullscreen, 0                                                     # fullscreen
bind = $mod SHIFT, F, fullscreen, 1                                                     # maximize
bind = $mod,       V, togglefloating,                                                   # toggle float on active window
bind = $mod SHIFT, V, workspaceopt, allfloat                                            # toggle float on all active windows
bind = $mod,       S, togglesplit,                                                      # toggle split

bindm = $mod, mouse:272, movewindow   # move window with LMB
bindm = $mod, mouse:273, resizewindow # resize window with RMB

binde = ALT, TAB, cyclenext        # cycle between windows
binde = ALT, TAB, bringactivetotop # bring active window to the top

# move focus
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, right, movewindow, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# resize windows
bind = $mod ALT, left,  resizeactive, -64  0
bind = $mod ALT, down,  resizeactive,  0   64
bind = $mod ALT, up,    resizeactive,  0  -64
bind = $mod ALT, right, resizeactive,  64  0

bind = $mod ALT, H, resizeactive, -64  0
bind = $mod ALT, J, resizeactive,  0   64
bind = $mod ALT, K, resizeactive,  0  -64
bind = $mod ALT, L, resizeactive,  64  0

# display zoom
bind = $mod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # increase zoom
bind = $mod SHIFT, mouse_up,   exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # decrease zoom
bind = $mod SHIFT, Z,          exec, hyprctl keyword cursor:zoom_factor 1 # reset zoom

# workspaces
bind = $mod, 1, workspace, 1  # switch to workspace N
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1  # move active window to workspace N
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod,       RETURN, togglespecialworkspace, S         # switch to special workspace
bind = $mod SHIFT, RETURN, movetoworkspace,        special:S # move active window to special workspace

bind = $mod,       TAB, workspace, m+1 # switch to the next workspace
bind = $mod SHIFT, TAB, workspace, m-1 # switch to the previous workspace

bind = $mod, mouse_down, workspace, e+1 # scroll to workspace N+1
bind = $mod, mouse_up,   workspace, e-1 # scroll to workspace N-1

# hyprshot screenshots
bind = $mod, PRINT, exec, hyprshot -m window --clipboard-only
bind =     , PRINT, exec, hyprshot -m output --clipboard-only

bind = $mod SHIFT, PRINT, exec, hyprshot -m window --output-folder $screenshots_dir
bind =      SHIFT, PRINT, exec, hyprshot -m output --output-folder $screenshots_dir

bind = $mod SHIFT, S, exec, hyprshot -m region --clipboard-only

# laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioPlay,         exec, playerctl play-pause
bindel = , XF86AudioPause,        exec, playerctl play-pause
bindel = , XF86AudioNext,         exec, playerctl next 
bindel = , XF86AudioPrev,         exec, playerctl previous
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = , XF86Lock,              exec, hyprlock
